name: HabitSystem
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  HabitEngine:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3V2UU7RRK9
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    HABIT_APP_ENTITLEMENTS: HabitSystem.entitlements
  configs:
    Debug:
      HABIT_CLOUD_ENVIRONMENT: Development
    Release:
      HABIT_CLOUD_ENVIRONMENT: Production
targets:
  HabitSystem:
    type: application
    platform: macOS
    sources:
      - Sources/HabitSystemApp
    dependencies:
      - package: HabitEngine
        product: HabitEngine
      - package: HabitEngine
        product: HabitWidgetData
      - target: HabitSystemWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.orbitlabs.habitsystem.mac
        PRODUCT_NAME: Habit System
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: $(HABIT_APP_ENTITLEMENTS)
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts:
      - name: Build application icon
        script: '"$SRCROOT/scripts/build-icon.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy application icon
        script: 'cp "$SRCROOT/build/HabitSystem.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/HabitSystem.icns"'
        basedOnDependencyAnalysis: false
  HabitSystemWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Sources/HabitWidgetExtension
    dependencies:
      - package: HabitEngine
        product: HabitWidgetData
      - package: HabitEngine
        product: HabitWidgetViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.orbitlabs.habitsystem.mac.widgets
        PRODUCT_NAME: Habit System Widgets
        INFOPLIST_FILE: WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: HabitWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HabitSystemNotificationQA:
    type: application
    platform: macOS
    sources:
      - Sources/HabitSystemApp
    dependencies:
      - package: HabitEngine
        product: HabitEngine
      - package: HabitEngine
        product: HabitWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.orbitlabs.habitsystem.mac.notificationqa
        PRODUCT_NAME: Habit System Notification QA
        INFOPLIST_FILE: NotificationQAInfo.plist
        CODE_SIGN_ENTITLEMENTS: NotificationQA.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HABIT_NOTIFICATION_QA
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
  HabitSystemTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HabitSystemTests
      - Sources/HabitSystemApp/DomainModels.swift
      - Sources/HabitSystemApp/WallClockTime.swift
      - Sources/HabitSystemApp/AppModel.swift
      - Sources/HabitSystemApp/WidgetPublishing.swift
      - Sources/HabitSystemApp/Settings/AppServices.swift
    dependencies:
      - package: HabitEngine
        product: HabitEngine
      - package: HabitEngine
        product: HabitWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.orbitlabs.habitsystem.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HabitSystemNotificationQA:
    build:
      targets:
        HabitSystemNotificationQA: all
  HabitSystem:
    build:
      targets:
        HabitSystem: all
    test:
      targets:
        - HabitSystemTests
