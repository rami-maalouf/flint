# Proof on every PR, on several cloud iPhones at once.
#
# For every pull request that touches the app: find an iOS simulator build with the same
# native fingerprint and repack the pull request's JavaScript into it (about 3 minutes), or
# make a new build when the native layer changed (about 17 minutes). Then run the e2e
# suite with TesterArmy's EAS Simulator device provider (@e2e-dev/eas, `easSimulators()`
# in e2e.config.ts). The provider leases one EAS Simulator session per worker through
# Expo's API with EXPO_TOKEN, each with the build installed, and e2e spreads the test
# files across them. The run summary and every session replay
# link are posted as a pull request comment, and the sessions are stopped when the run ends.
#
# After the suite, the agent explores what the pull request describes: `e2e explore` gets
# the pull request title, body, and changed source files as its goal, taps through the app
# on a fresh cloud iPhone, and reports findings. Findings inform the comment; only the
# suite decides pass or fail.
#
# The tests live in tests/e2e/*.e2e.ts and the runner config in e2e.config.ts.
# Deterministic tests need no model; agent steps use the `default` agent (the strong
# model) unless the `agent` input picks `fast`.
#
# Required EAS environment variables (production environment):
#   EXPO_TOKEN            - auths eas-cli for the simulator sessions (already set)
#   GITHUB_TOKEN          - fine-grained PAT with pull request write on this repo
#   E2E_OAUTH_CREDENTIALS - the ChatGPT login json (~/.config/e2e/oauth.json) for the
#                           agent steps; the default model in e2e.config.ts. Refreshed
#                           tokens are not written back, so paste a fresh copy when a
#                           run reports LOGIN_REQUIRED.
#   E2E_ANTHROPIC_API_KEY - alternative: an api key, with E2E_MODEL=anthropic/<id>.
#                           Named this way on purpose: ANTHROPIC_API_KEY would also be
#                           picked up by the agent-fix workflow and bill the api.

name: e2e on EAS Simulator (proof on every PR)

# a new push to the same branch cancels the run still going, so two runs of one pull
# request never compete for the account's two simulator sessions.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

on:
  pull_request:
    branches: [main]
    # only pull requests that can change what the phone shows. docs, specs, and the other
    # workflows do not lease simulators.
    paths:
      - src/**
      - modules/**
      - assets/**
      - tests/e2e/**
      - e2e.config.ts
      - app.config.js
      - app.json
      - eas.json
      - package.json
      - bun.lock
      - .eas/workflows/e2e-pr.yml
  # manual runs: `eas workflow:run .eas/workflows/e2e-pr.yml -F pr_number=2 -F workers=3`
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to comment on (optional)'
        required: false
      grep:
        description: 'Only run tests whose title matches this pattern (optional)'
        required: false
      workers:
        description: 'How many cloud iPhones to lease at once (default 2; the account allows two concurrent sessions)'
        required: false
      goal:
        description: 'Exploration goal for a manual run (a pull request run uses the PR body)'
        required: false
      agent:
        description: 'Agent from e2e.config.ts for the agent steps: default (strong model) or fast'
        required: false

jobs:
  fingerprint:
    name: Fingerprint the native runtime
    type: fingerprint
    environment: production

  get_build:
    name: Find a matching simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: sim
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack:
    # the native layer did not change: put this pull request's javascript into the
    # matching build instead of testing it with the old bundle.
    name: Repack the pull request's JavaScript into the matching build
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    type: repack
    environment: production
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: sim

  build:
    name: Build the simulator app
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: sim

  e2e:
    name: Run e2e on EAS Simulators
    after: [repack, build]
    if: ${{ after.repack.outputs.build_id || after.build.outputs.build_id }}
    environment: production
    env:
      BUILD_ID: ${{ after.repack.outputs.build_id || after.build.outputs.build_id }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
      E2E_GREP: ${{ inputs.grep || '' }}
      E2E_WORKERS: ${{ inputs.workers || '2' }}
      E2E_AGENT: ${{ inputs.agent || 'default' }}
      EXPLORE_GOAL: ${{ inputs.goal || github.event.pull_request.body || '' }}
      EXPLORE_TITLE: ${{ github.event.pull_request.title || '' }}
      REPO: rami-maalouf/flint
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      - name: Run the e2e suite on leased EAS Simulators
        id: e2e_run
        run: |
          # the runner is invoked through its node bin so node, not bun, executes it.
          # E2E_EAS_SIMULATOR=1 makes e2e.config.ts lease one session per worker with
          # BUILD_ID installed, so nothing here starts or stops sessions by hand. the
          # provider logs each session as "simulator session <id>, <url>"; the comment
          # and the safety step read those lines back from the logs.
          mkdir -p .e2e
          echo "node $(node --version), e2e $(./node_modules/.bin/e2e --version), workers $E2E_WORKERS, agent $E2E_AGENT"
          E2E_ARGS="run --reporter list,markdown,junit --agent $E2E_AGENT"
          if [ -n "$E2E_GREP" ]; then E2E_ARGS="$E2E_ARGS --grep $E2E_GREP"; fi
          set +e
          # shellcheck disable=SC2086
          E2E_EAS_SIMULATOR=1 E2E_BUILD_ID="$BUILD_ID" ./node_modules/.bin/e2e $E2E_ARGS 2>&1 | tee .e2e/run.log
          E2E_EXIT=${PIPESTATUS[0]}
          set -e
          echo "e2e exit code: $E2E_EXIT"
          # explore writes its own .e2e/summary.md later; keep the suite's copy apart.
          [ -f .e2e/summary.md ] && cp .e2e/summary.md .e2e/suite-summary.md
          exit "$E2E_EXIT"

      - name: Explore what the pull request describes
        if: ${{ always() }}
        run: |
          # the agent gets the pull request text as a goal and reports findings.
          # a found issue exits 1; that informs the comment and does not fail the job.
          if [ -z "$EXPLORE_GOAL" ]; then
            echo "no goal (no pull request body or goal input); skipping the exploration"
            exit 0
          fi
          if [ -f .e2e/summary.md ] && [ ! -f .e2e/suite-summary.md ]; then cp .e2e/summary.md .e2e/suite-summary.md; fi
          rm -f .e2e/summary.md
          GOAL="You are testing a pull request to a habit tracker app for iOS. Explore the app as a careful user would, focused on what the pull request describes, and report anything that does not behave as described or looks broken."
          if [ -n "$EXPLORE_TITLE" ]; then GOAL="$GOAL Pull request title: $EXPLORE_TITLE."; fi
          # e2e caps a goal at 2000 characters. keep the first 1200 of the description so the
          # changed files below still fit; a long description is summary, validation, evidence.
          GOAL="$GOAL Pull request description: ${EXPLORE_GOAL:0:1200}"
          # the changed source files point the agent at the screens the pull request
          # touched. read through gh so no git history is needed on the worker; a failure
          # here only leaves the list out.
          if [ -n "$PR_NUMBER" ]; then
            CHANGED="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files \
              --jq '[.files[].path | select(startswith("src/") or startswith("modules/"))] | .[:25] | join(", ")' 2>/dev/null || true)"
            if [ -n "$CHANGED" ]; then GOAL="$GOAL Source files changed by the pull request, to locate the screens it touched: $CHANGED"; fi
          fi
          GOAL="${GOAL:0:1990}"
          echo "explore goal: ${#GOAL} characters"
          set +e
          E2E_EAS_SIMULATOR=1 E2E_BUILD_ID="$BUILD_ID" E2E_WORKERS=1 \
            ./node_modules/.bin/e2e explore --max-steps 5 --timeout 360000 --agent "$E2E_AGENT" \
              --reporter list,markdown "$GOAL" 2>&1 | tee .e2e/explore.log
          EXPLORE_EXIT=${PIPESTATUS[0]}
          set -e
          [ -f .e2e/summary.md ] && mv .e2e/summary.md .e2e/explore-summary.md
          echo "explore exit code: $EXPLORE_EXIT (0 passed, 1 findings, 2 or 3 could not run)"

      - name: Post the summary and the replay links on the pull request
        if: ${{ always() }}
        run: |
          # gh reads GITHUB_TOKEN from the environment on its own.
          if [ -z "$PR_NUMBER" ]; then
            echo "no pull request; skipping the comment"
            exit 0
          fi
          {
            if [ -f .e2e/suite-summary.md ]; then
              cat .e2e/suite-summary.md
            elif [ -f .e2e/summary.md ]; then
              cat .e2e/summary.md
            else
              echo "### e2e: the run did not produce a summary"
              if [ -f .e2e/run.log ]; then
                echo
                echo '```'
                tail -n 40 .e2e/run.log
                echo '```'
              fi
            fi
            echo
            if [ -s .e2e/explore-summary.md ]; then
              echo "### Exploration of what this pull request describes"
              echo
              cat .e2e/explore-summary.md
              echo
            fi
            URLS="$(cat .e2e/run.log .e2e/explore.log 2>/dev/null | grep -oE 'simulator session [0-9a-f-]+, https://[^[:space:]]+' | sed -E 's/.*, //' | sort -u)"
            if [ -n "$URLS" ]; then
              echo "Session replays (one cloud iPhone per line):"
              echo "$URLS" | while IFS= read -r url; do [ -n "$url" ] && echo "- $url"; done
            else
              echo "Session replays: unavailable"
            fi
          } > .e2e-comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file .e2e-comment.md

      - name: Stop any session the run left behind
        if: ${{ always() }}
        run: |
          # the provider stops its sessions on every exit path; this is the safety net:
          # every session id the logs mention gets a stop, which is a no-op when it is
          # already stopped.
          cat .e2e/run.log .e2e/explore.log 2>/dev/null \
            | grep -oE 'simulator session [0-9a-f-]+' | awk '{print $3}' | sort -u \
            | while IFS= read -r id; do
                [ -n "$id" ] && npx --yes eas-cli@latest simulator:stop --id "$id" --json --non-interactive || true
              done

      - name: Keep the run artifacts
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: e2e-artifacts
          path: .e2e
          ignore_error: true
